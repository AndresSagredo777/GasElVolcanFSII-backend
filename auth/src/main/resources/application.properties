spring.application.name=auth

server.port = 8081
spring.datasource.url=${AUTH_DB_URL:jdbc:mysql://localhost:3306/gaselvolcan_auth}
spring.datasource.username=${AUTH_DB_USER:root}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.admin.initial-email=${INITIAL_ADMIN_EMAIL:}
app.admin.initial-password=${INITIAL_ADMIN_PASSWORD:}
app.admin.initial-name=${INITIAL_ADMIN_NAME:Administrador}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

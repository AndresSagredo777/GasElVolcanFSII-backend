# Auth se publica detras de Nginx; no exponer el puerto directamente.
server.address=127.0.0.1
server.port=8081

# Base de datos de Auth. Las credenciales se entregan desde el entorno.
spring.datasource.url=${AUTH_DB_URL}
spring.datasource.username=${AUTH_DB_USER}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Auth y Catalogo deben recibir exactamente el mismo secreto.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# Origen publico del frontend, por ejemplo https://gaselvolcan.example
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}

# Aprovisionamiento inicial opcional del administrador.
app.admin.initial-email=${INITIAL_ADMIN_EMAIL:}
app.admin.initial-password=${INITIAL_ADMIN_PASSWORD:}
app.admin.initial-name=${INITIAL_ADMIN_NAME:Administrador}

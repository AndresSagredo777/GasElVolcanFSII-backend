databaseChangeLog:
  - changeSet:
      id: 002-datos-perfil-usuario
      author: gaselvolcan
      changes:
        - addColumn:
            tableName: usuarios
            columns:
              - column:
                  name: nombre
                  type: VARCHAR(150)
                  defaultValue: Usuario
                  constraints:
                    nullable: false
              - column:
                  name: telefono
                  type: VARCHAR(30)
              - column:
                  name: direccion
                  type: VARCHAR(255)

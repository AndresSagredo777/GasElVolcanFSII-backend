spring.application.name=catalogo

server.port=8082
spring.datasource.url=${CATALOGO_DB_URL:jdbc:mysql://localhost:3306/gaselvolcan_catalogo}
spring.datasource.username=${CATALOGO_DB_USER:catalogo_app}
spring.datasource.password=${CATALOGO_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:gaselvolcan-auth}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

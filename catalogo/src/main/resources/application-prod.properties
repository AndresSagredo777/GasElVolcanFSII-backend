server.address=127.0.0.1
server.port=8082

spring.datasource.url=${CATALOGO_DB_URL}
spring.datasource.username=${CATALOGO_DB_USER}
spring.datasource.password=${CATALOGO_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:gaselvolcan-auth}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}
